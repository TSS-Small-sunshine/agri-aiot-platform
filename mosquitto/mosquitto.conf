# 智慧农业 AIoT 平台 —— Mosquitto 配置
# 演示环境：允许匿名接入（无密码文件），持久化到 /mosquitto/data，日志走 stdout。

listener 1883
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# 日志输出到 stdout/stderr，便于 docker logs 查看
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
